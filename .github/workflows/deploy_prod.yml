name: Release & Deployment

on:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync_dev_to_main:
    name: Sync dev to main (Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync dev into main
        run: |
          git checkout main
          git pull origin main
          git fetch origin dev:dev
          COMMITS_AHEAD=$(git rev-list --count main..dev)
          if [ "$COMMITS_AHEAD" -gt 0 ]; then
            echo "Found $COMMITS_AHEAD new commits in dev. Merging into main..."
            git merge dev --no-ff -m "chore(release): nightly merge dev into main [skip ci]"
            git push origin main
          else
            echo "No new commits in dev to merge."
          fi

  release:
    name: Semantic Commit, Tests, Oxlint
    needs: [sync_dev_to_main]
    if: always() && (needs.sync_dev_to_main.result == 'success' || needs.sync_dev_to_main.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Oxlint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy:
    name: Build Docker & Deploy to VPS
    needs: release
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /home/maxnumerique/apps/grimoire_tactics
            cd /home/maxnumerique/apps/grimoire_tactics
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T app npx prisma db push --accept-data-loss
            docker image prune -f
