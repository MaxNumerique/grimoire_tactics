name: CI Checks

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  verify:
    name: Lint, Build and Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Semantic Commit
        run: git log origin/${{ github.base_ref }}..HEAD --oneline | grep -qE ' (feat|fix|docs|refactor|chore)(\(.*\))?:'

      - name: Install Dependencies
        run: npm install

      - name: Run Oxlint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
